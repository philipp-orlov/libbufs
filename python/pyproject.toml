[project]
name = "bufs"
version = "0.1.0"
description = "libbufs zero-copy binary messages: the runtime for code generated by bufsc --py"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bufs"]
